<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fear &amp; Hunger — engine độc lập</title>
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="stylesheet" href="fonts/gamefont.css">
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080706; color: #e7ddca; }
        main { width: min(816px, 100vw); }
        canvas { display: block; width: 100%; image-rendering: pixelated; background: #080706; }
        #fnh-canvas:focus { outline: none; }
        #fnh-status { padding: 10px 12px; color: #b8aa95; font-size: 13px; }
        #fnh-message { min-height: 48px; padding: 12px; border: 1px solid #564a3c; background: #17120f; white-space: pre-wrap; }
        .fnh-gameplay #fnh-status, .fnh-gameplay label[for='fnh-volume'] { display: none; }
        .fnh-gameplay #fnh-controls, .fnh-gameplay #fnh-menu, .fnh-gameplay #fnh-save, .fnh-gameplay #fnh-load { display: none; }
        .fnh-gameplay #fnh-message { display: none; position: absolute; inset: auto 0 0; box-sizing: border-box; max-height: 50%; overflow: auto; z-index: 2; background: #080808ed; font: clamp(16px, 3.4vw, 28px) GameFont, serif; }
        .fnh-gameplay #fnh-message:has(#fnh-next:not([hidden]), #fnh-choices button) { display: block; }
        button { margin-top: 8px; padding: 6px 10px; color: #e7ddca; background: #17120f; border: 1px solid #8c7759; }
        #fnh-choices { display: flex; flex-wrap: wrap; gap: 8px; }
        #fnh-choice-help { margin-top: 8px; color: #b8aa95; }
        .fnh-difficulty { container-type: inline-size; }
        .fnh-difficulty #fnh-message, .fnh-difficulty #fnh-choices, .fnh-difficulty #fnh-choice-help { position: absolute; box-sizing: border-box; margin: 0; padding: 2.2059cqw; border: 0; background-color: #000d; background-size: 100% 100%; color: white; font: 3.4314cqw/4.4118cqw GameFont, serif; text-shadow: 1px 1px 2px black; z-index: 2; }
        .fnh-difficulty #fnh-message { display: block; inset: auto 0 0; height: 28.8462%; max-height: none; white-space: normal; }
        .fnh-difficulty #fnh-choice-help { inset: 0 0 auto; height: 11.5385%; }
        .fnh-difficulty #fnh-choices { display: flex; flex-direction: column; gap: 0; left: 50%; bottom: 28.8462%; transform: translateX(-50%); height: 28.8462%; }
        .fnh-difficulty #fnh-choices button { flex: 1; min-height: 0; margin: 0; padding: 0 .49cqw; border: 0; background: transparent; text-align: left; white-space: nowrap; color: white; font: inherit; line-height: 4.4118cqw; text-shadow: inherit; }
        .fnh-difficulty #fnh-choices button:focus, .fnh-difficulty #fnh-choices button[data-selected='true'] { outline: none; background: #b99aaa59; box-shadow: inset 0 0 0 1px #eee8; }
        button:disabled { opacity: 0.45; }
        #fnh-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        #fnh-controls[hidden] { display: none; }
        #fnh-controls button[data-direction] { touch-action: none; user-select: none; }
        button:focus-visible { outline: 2px solid #e7ddca; }
        .fnh-stage { position: relative; }
        #fnh-loading { position: absolute; inset: 0; z-index: 10; display: grid; place-items: end center; background: linear-gradient(#080706a8, #080706ed), url('img/titles2/title2.png') center / cover no-repeat; }
        #fnh-loading[hidden] { display: none; }
        #fnh-loading p { margin: 0 0 9%; color: #ded3bb; font: clamp(18px, 3vw, 26px) GameFont, serif; letter-spacing: .08em; text-shadow: 0 2px 5px #000; }
        #fnh-loading p::after { content: ''; display: block; width: 72px; height: 2px; margin: 12px auto 0; background: #a99a7b; animation: fnh-loading-pulse 1.2s ease-in-out infinite alternate; }
        @keyframes fnh-loading-pulse { from { opacity: .25; transform: scaleX(.55); } to { opacity: 1; transform: scaleX(1); } }
        @media (prefers-reduced-motion: reduce) { #fnh-loading p::after { animation: none; } }
        #fnh-timer { position: absolute; top: 0; right: 0; width: 11.765%; height: 7.692%; display: grid; place-items: center; font: clamp(14px, 3.92vw, 32px) GameFont, serif; color: white; text-shadow: -2px -2px 2px black, 2px 2px 2px black; pointer-events: none; z-index: 2; }
        #fnh-timer[hidden] { display: none; }
        #fnh-video { position: absolute; inset: 0; width: 100%; height: 100%; background: black; object-fit: contain; pointer-events: none; }
        #fnh-video[hidden] { display: none; }
        #fnh-video-play { position: absolute; inset: 40% 30%; }
        #fnh-scroll-text { position: absolute; inset: 0; overflow: hidden; background: #000; }
        #fnh-scroll-content { position: absolute; inset: 0 24px auto; text-align: center; white-space: pre-wrap; font: 28px/36px GameFont, serif; }
        #fnh-scroll-fast { position: absolute; bottom: 8px; right: 8px; touch-action: none; }
        #fnh-end-screen { position: absolute; inset: 0; background: #000; }
        #fnh-battle-fade { position: absolute; inset: 0; background: #000; z-index: 5; pointer-events: none; }
        #fnh-battle-encounter { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; z-index: 3; pointer-events: none; }
        #fnh-battle-encounter canvas { width: 100%; height: 100%; }
        #fnh-battle-flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 4; pointer-events: none; }
        #fnh-end-screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #fnh-end-actions { position: absolute; left: 50%; bottom: 15.38%; transform: translateX(-50%); box-sizing: border-box; width: min(70%, 240px); padding: 12px; text-align: center; background: #080808df; border: 2px solid #9a9688; box-shadow: inset 0 0 0 2px #373737, 0 2px 8px #000; font: clamp(16px, 3.4vw, 28px) GameFont, serif; }
        #fnh-end-actions button, #fnh-end-actions select { max-width: 100%; font: inherit; }
        #fnh-end-actions button { display: block; width: 100%; margin: 0; padding: 3px; border: 0; background: transparent; }
        #fnh-end-actions button:hover, #fnh-end-actions button:focus-visible { background: #ffffff26; }
        #fnh-end-actions label { display: block; font-size: .7em; }
        #fnh-end-title { margin: 0 0 8px; font: inherit; text-shadow: 1px 1px #000; }
        #fnh-end-screen { container-type: inline-size; }
        #fnh-end-screen[data-scene='title'] #fnh-end-actions { width: 29.4118%; height: 17.3077%; bottom: 15.3846%; padding: 2.2059cqw; background: #000b; border: 0; box-shadow: none; color: white; font: 3.4314cqw/4.4118cqw GameFont, serif; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; }
        #fnh-title-frame { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; }
        #fnh-end-screen[data-scene='title'] #fnh-end-actions > button { height: 4.4118cqw; padding: 0 .49cqw; text-align: left; outline: none; color: inherit; text-shadow: inherit; }
        #fnh-end-actions > button:focus-visible { outline: 1px solid #ded3bb; }
        #fnh-end-screen[data-scene='title'] #fnh-end-actions > button[data-selected='true'], #fnh-end-screen[data-scene='title'] #fnh-end-actions > button:hover { background: #b99aaa59; box-shadow: inset 0 0 0 1px #eee8; }
        #fnh-end-screen [hidden], #fnh-end-actions button[hidden] { display: none; }
        #fnh-end-save-panel { position: absolute; inset: 12% 10%; padding: 24px; background: #080808f5; border: 1px solid #a9a49a; font: clamp(16px, 3vw, 26px) GameFont, serif; }
        #fnh-end-save-panel select { display: block; width: 100%; margin: 20px 0; font: inherit; }
        #fnh-end-save-panel button { font: inherit; }
        #fnh-end-error { color: #f1b4a4; }
        #fnh-menu-dialog { box-sizing: border-box; width: min(816px, 96vw); max-height: 90vh; overflow: auto; padding: 16px; background: #10100feb; border: 2px solid #88877d; box-shadow: inset 0 0 0 2px #343431; font-family: GameFont, serif; }
        #fnh-menu-dialog[open] { display: grid; grid-template-columns: minmax(100px, 140px) minmax(0, 1fr); grid-template-areas: 'title close' 'actor select' 'nav message' 'nav content'; gap: 8px 16px; align-items: start; }
        #fnh-menu-title { grid-area: title; margin: 0; }
        #fnh-menu-close { grid-area: close; justify-self: end; margin: 0; }
        #fnh-menu-dialog > label { grid-area: actor; }
        #fnh-menu-actor { grid-area: select; max-width: 100%; }
        #fnh-menu-dialog nav { grid-area: nav; display: flex; flex-direction: column; gap: 2px; padding: 8px; background: #080808b8; border: 1px solid #77766e; }
        #fnh-menu-dialog nav button { margin: 0; border: 0; background: transparent; text-align: left; font: inherit; }
        #fnh-menu-dialog nav button[aria-pressed='true'] { outline: 0; background: #ffffff30; }
        #fnh-menu-message { grid-area: message; margin: 0; }
        #fnh-menu-content { grid-area: content; min-width: 0; padding: 8px; background: #0808089c; border: 1px solid #77766e; }
        #fnh-menu-content label { display: block; margin: 12px 0; }
        #fnh-menu-dialog.fnh-menu-home { aspect-ratio: 816 / 624; max-height: 96vh; padding: 0; grid-template-columns: 8.58% minmax(0, 1fr); grid-template-rows: 1fr; grid-template-areas: 'nav content'; gap: 0; container-type: inline-size; }
        .fnh-menu-home #fnh-menu-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        .fnh-menu-home #fnh-menu-close { position: absolute; left: 0; bottom: 0; width: 8.58%; padding: 2px; font: 2.45cqw GameFont, serif; }
        .fnh-menu-home #fnh-menu-message:empty { display: none; }
        #fnh-menu-dialog.fnh-menu-home nav { padding: 12% 3%; gap: 0; }
        #fnh-menu-dialog.fnh-menu-home nav button { height: 4.41cqw; padding: 0; font-size: 2.45cqw; white-space: nowrap; }
        #fnh-menu-dialog.fnh-menu-home nav button[data-menu-tab='synthesis'] { font-size: 1.25cqw; }
        #fnh-menu-dialog.fnh-menu-home nav button[data-menu-tab='options'] { font-size: 1.65cqw; }
        .fnh-menu-home #fnh-menu-content { padding: 2.2cqw; height: 100%; box-sizing: border-box; }
        .fnh-menu-home .fnh-party-overview { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; height: 100%; }
        .fnh-menu-home .fnh-party-overview section { position: relative; height: 100%; font-size: 2.45cqw; }
        .fnh-menu-home .fnh-party-name { position: absolute; top: 6.12%; left: 3%; margin: 0; padding: 0; border: 0; background: transparent; font: inherit; outline: none; }
        .fnh-menu-home .fnh-party-name:focus-visible { outline: 1px solid #e7ddca; }
        .fnh-menu-home .fnh-party-nickname { position: absolute; top: 12.24%; left: 3%; margin: 0; }
        .fnh-menu-home .fnh-menu-bust { position: absolute; top: 17%; height: 61.22%; object-fit: cover; object-position: center top; }
        .fnh-menu-home .fnh-menu-state-icons { position: absolute; top: 67.35%; left: 3%; min-height: 0; }
        .fnh-menu-home #fnh-menu-content label { position: absolute; left: 3%; right: 3%; margin: 0; font-size: 2.2cqw; }
        .fnh-menu-home .fnh-party-hunger { top: 73.47%; }
        .fnh-menu-home .fnh-party-hp { top: 79.59%; }
        .fnh-menu-home .fnh-party-mp { top: 85.71%; }
        .fnh-menu-home meter { height: 1.22cqw; appearance: none; background: #202020; border: 0; }
        .fnh-menu-home meter::-webkit-meter-bar { background: #202020; border: 0; border-radius: 0; }
        .fnh-menu-home meter::-webkit-meter-optimum-value { background: #b49a57; }
        .fnh-menu-home .fnh-party-hp meter::-webkit-meter-optimum-value { background: linear-gradient(90deg, #65252a, #b65a58); }
        .fnh-menu-home .fnh-party-mp meter::-webkit-meter-optimum-value { background: linear-gradient(90deg, #293c69, #6388b7); }
        .fnh-menu-home meter::-moz-meter-bar { background: #b49a57; }
        .fnh-party-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 12px; }
        .fnh-party-overview section { min-width: 0; }
        .fnh-party-overview meter { display: block; width: 100%; }
        .fnh-menu-bust { display: block; width: 100%; height: 360px; object-fit: none; object-position: center top; }
        .fnh-menu-state-icons { display: flex; flex-wrap: wrap; min-height: 32px; }
        .fnh-menu-state-icon { display: inline-block; width: 32px; height: 32px; background-image: url('img/system/IconSet.png'); flex: 0 0 32px; image-rendering: pixelated; }
        .fnh-text-icon { display: inline-block; width: 32px; height: 32px; vertical-align: middle; background-image: url('img/system/IconSet.png'); image-rendering: pixelated; }
        .fnh-actor-profile { white-space: pre-wrap; }
        .fnh-state-rates { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
        .fnh-state-rates dd { margin: 0; }
        #fnh-menu-save-slot, #fnh-end-save-slot { max-width: 100%; }
        [aria-pressed="true"] { outline: 2px solid #e7ddca; }
        dialog { color: inherit; background: #17120f; border: 1px solid #8c7759; }
        dialog::backdrop { background: #000b; }
        #fnh-name-input { display: block; margin-top: 12px; padding: 8px; font: inherit; }
        #fnh-name-dialog { box-sizing: border-box; width: min(816px, 100vw); max-width: 100vw; max-height: 100vh; aspect-ratio: 816 / 624; padding: 0; border: 0; background: #0009; container-type: inline-size; overflow: hidden; color: white; font: 3.4314cqw GameFont, serif; }
        #fnh-name-dialog::backdrop { background: #0008; backdrop-filter: blur(4px); }
        .fnh-name-window { position: absolute; left: 20.5882%; width: 58.8235%; background: #08080880; }
        #fnh-name-edit { top: 6.0897%; height: 28.8462%; }
        #fnh-name-keys { top: 36.2179%; height: 57.6923%; }
        .fnh-name-frame { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; }
        #fnh-name-face { position: absolute; left: 3.75%; top: 10%; width: 30%; height: 80%; background-repeat: no-repeat; background-size: 400% 200%; }
        #fnh-name-slots { position: absolute; left: 36%; right: 3.75%; top: 40%; display: flex; height: 20%; }
        #fnh-name-slots span { flex: 1; min-width: 0; text-align: center; border-bottom: 2px solid #fff3; font: 3.4314cqw/4.4118cqw GameFont, serif; text-shadow: 1px 1px 2px #000; }
        #fnh-name-slots span[data-cursor='true'] { background: #b99aaa59; box-shadow: inset 0 0 0 1px #eee8; }
        #fnh-name-input { position: absolute; left: 36%; top: 40%; box-sizing: border-box; width: 60%; height: 20%; margin: 0; padding: 0; opacity: 0; }
        #fnh-name-grid { position: absolute; inset: 5% 3.75%; }
        #fnh-name-grid button { position: absolute; width: 9.4595%; height: 11.1111%; margin: 0; padding: 0; border: 0; background: transparent; color: white; text-shadow: 1px 1px 2px #000; font: 3.4314cqw/4.4118cqw GameFont, serif; outline: none; }
        #fnh-name-grid button[data-selected='true'], #fnh-name-grid button:hover { background: #b99aaa59; box-shadow: inset 0 0 0 1px #eee8; }
        #fnh-name-form > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    </style>
</head>
<body>
<main>
    <div class="fnh-stage">
        <canvas id="fnh-canvas" width="816" height="624" tabindex="0" aria-label="Bản đồ game"></canvas>
        <div id="fnh-loading" role="status"><p>Đang tải…</p></div>
        <div id="fnh-timer" hidden aria-label="Thời gian còn lại"></div>
        <div id="fnh-battle-encounter" hidden aria-hidden="true"><canvas width="816" height="624"></canvas></div>
        <div id="fnh-battle-flash" hidden aria-hidden="true"></div>
        <div id="fnh-battle-fade" hidden aria-hidden="true"></div>
        <video id="fnh-video" playsinline disablepictureinpicture disableremoteplayback tabindex="-1" hidden aria-label="Cảnh mở đầu"></video>
        <button id="fnh-video-play" type="button" hidden>Tiếp tục</button>
        <div id="fnh-scroll-text" hidden tabindex="0" role="region" aria-label="Credits">
            <div id="fnh-scroll-content"></div>
            <button id="fnh-scroll-fast" type="button">Giữ để chạy nhanh</button>
        </div>
        <section id="fnh-end-screen" hidden aria-labelledby="fnh-end-title">
            <img id="fnh-end-background" alt="">
            <img id="fnh-end-overlay" alt="" hidden>
            <div id="fnh-end-actions">
                <canvas id="fnh-title-frame" width="240" height="108" aria-hidden="true" hidden></canvas>
                <h2 id="fnh-end-title"></h2>
                <button id="fnh-new-game" type="button">Chơi mới</button>
                <button id="fnh-continue" type="button">Continue</button>
            </div>
            <section id="fnh-end-save-panel" hidden aria-label="Load game">
                <label for="fnh-end-save-slot">Ô lưu</label><select id="fnh-end-save-slot"></select>
                <button id="fnh-end-load" type="button">Tải ô 1</button>
                <button id="fnh-end-save-back" type="button">Cancel</button>
                <p id="fnh-end-error" role="status"></p>
            </section>
        </section>
    </div>
    <dialog id="fnh-name-dialog">
        <form id="fnh-name-form">
            <label for="fnh-name-input">Tên nhân vật</label>
            <div id="fnh-name-edit" class="fnh-name-window">
                <canvas class="fnh-name-frame" width="480" height="180" aria-hidden="true"></canvas>
                <div id="fnh-name-face" role="img"></div>
                <div id="fnh-name-slots" aria-hidden="true"></div>
                <input id="fnh-name-input" autocomplete="off" spellcheck="false">
            </div>
            <div id="fnh-name-keys" class="fnh-name-window">
                <canvas class="fnh-name-frame" width="480" height="360" aria-hidden="true"></canvas>
                <div id="fnh-name-grid" aria-label="Bảng ký tự"></div>
            </div>
        </form>
    </dialog>
    <dialog id="fnh-menu-dialog" aria-labelledby="fnh-menu-title">
        <h2 id="fnh-menu-title">Menu</h2>
        <button id="fnh-menu-close" type="button">Đóng</button>
        <label for="fnh-menu-actor">Nhân vật</label><select id="fnh-menu-actor"></select>
        <nav aria-label="Danh mục menu">
            <button type="button" data-menu-tab="inventory">Túi đồ</button>
            <button type="button" data-menu-tab="equipment">Trang bị</button>
            <button type="button" data-menu-tab="synthesis">Chế tạo</button>
            <button type="button" data-menu-tab="skills">Kỹ năng</button>
            <button type="button" data-menu-tab="status">Chỉ số</button>
            <button type="button" data-menu-tab="system">Lưu/Tải</button>
            <button type="button" data-menu-tab="options">Tùy chọn</button>
            <button type="button" data-menu-tab="gameEnd">Kết thúc</button>
        </nav>
        <p id="fnh-menu-message" aria-live="polite"></p>
        <div id="fnh-menu-content"></div>
    </dialog>
    <div id="fnh-status">Đang tải engine độc lập…</div>
    <div id="fnh-message" aria-live="polite">
        <div id="fnh-message-text"></div>
        <button id="fnh-next" type="button" hidden>Tiếp tục</button>
        <div id="fnh-choices"></div>
        <div id="fnh-choice-help" aria-live="polite"></div>
    </div>
    <nav id="fnh-controls" aria-label="Điều khiển game">
        <button type="button" data-direction="4" aria-label="Đi trái">←</button>
        <button type="button" data-direction="8" aria-label="Đi lên">↑</button>
        <button type="button" data-direction="2" aria-label="Đi xuống">↓</button>
        <button type="button" data-direction="6" aria-label="Đi phải">→</button>
        <button type="button" data-direction="0">Tương tác</button>
        <button type="button" data-common-event="289">Đốt đuốc (T)</button>
        <button type="button" data-common-event="257">Kỹ năng (C)</button>
    </nav>
    <button id="fnh-menu" type="button">Menu</button>
    <button id="fnh-save" type="button">Lưu ô 1</button>
    <button id="fnh-load" type="button">Tải ô 1</button>
    <label for="fnh-volume">Âm lượng <input id="fnh-volume" type="range" min="0" max="100" value="100"></label>
    <label><input id="fnh-always-dash" type="checkbox" checked> Luôn chạy nhanh</label>
    <section id="fnh-battle" hidden aria-label="Trận chiến">
        <strong id="fnh-battle-title">Trận chiến</strong>
        <p id="fnh-battle-round"></p>
        <img id="fnh-extra-turn" src="img/system/exturn.png" alt="Lượt bổ sung" hidden>
        <div id="fnh-battle-party"></div>
        <div id="fnh-battle-targets"></div>
        <label for="fnh-battle-actor">Nhân vật</label><select id="fnh-battle-actor"></select>
        <label for="fnh-battle-kind">Hành động</label><select id="fnh-battle-kind"><option value="skill">Kỹ năng</option><option value="item">Vật phẩm</option></select>
        <div id="fnh-battle-skill-controls">
        <label for="fnh-battle-skill">Kỹ năng</label><select id="fnh-battle-skill"></select>
        <button id="fnh-battle-use-skill" type="button">Chọn kỹ năng</button>
        </div>
        <div id="fnh-battle-item-controls" hidden>
            <label for="fnh-battle-item">Vật phẩm</label><select id="fnh-battle-item"></select>
            <button id="fnh-battle-use-item" type="button">Chọn vật phẩm</button>
        </div>
        <div id="fnh-battle-friends" aria-label="Mục tiêu trong đội"></div>
        <div id="fnh-battle-queue" aria-live="polite"></div>
        <button id="fnh-battle-start" type="button">Bắt đầu lượt</button>
        <p id="fnh-battle-log" aria-live="polite"></p>
        <button id="fnh-battle-attack" type="button">Chọn đánh</button>
        <button id="fnh-battle-escape" type="button">Chạy</button>
    </section>
</main>
<script src="js/libs/pixi.js"></script>
